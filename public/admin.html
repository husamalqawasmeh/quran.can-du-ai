<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مراجعة الاقتراحات</title>
<style>
:root{--bg:#e4e1d8;--card:#fff;--ink:#141a26;--muted:#4f5868;--line:#b9b2a1;--accent:#0f5c4d;--accent-ink:#fff;--title:#1d4ed8;--panel:#e8effd;--err:#b42318;--ok:#067647;--warn:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d11;--card:#232934;--ink:#f4f2ec;--muted:#b6bfcd;--line:#4a5363;--accent:#3fb99a;--accent-ink:#0b1712;--title:#6ea8fe;--panel:#1b2233;--err:#f97066;--ok:#47cd89;--warn:#fdb022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",Tahoma,sans-serif}
.page{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 6px;font-size:1.7rem}.sub{color:var(--muted);margin:0 0 18px;font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input,select,textarea{font:inherit;font-size:.95rem;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
textarea{width:100%;min-height:120px}
button{font:inherit;font-size:.92rem;padding:8px 18px;border-radius:99px;border:1px solid var(--accent);background:transparent;color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.bad{border-color:var(--err);color:var(--err)}button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.meta{color:var(--muted);font-size:.8rem;margin:4px 0}.score{display:inline-block;padding:1px 10px;border-radius:99px;border:1px solid var(--ok);color:var(--ok);font-size:.8rem}
.issues{border:1px solid var(--warn);border-radius:10px;padding:6px 10px;color:var(--warn);font-size:.85rem;margin:8px 0}
.vt{font-size:1.25rem;line-height:2;font-family:"Amiri","Traditional Arabic",serif;margin:4px 0}.ref{color:var(--muted);font-size:.8rem}
#msg{min-height:1.5em;color:var(--muted)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}
.tagline{justify-self:start;color:var(--accent);font-size:1.15rem;font-weight:600}
.htitle{justify-self:center;font-size:1.9rem;font-weight:800;line-height:1.2}
.brand{justify-self:end;font-size:1.15rem;font-weight:700;direction:ltr}.brand span{color:var(--accent)}
@media(max-width:760px){.top{grid-template-columns:1fr;text-align:center;gap:4px}.top>*{justify-self:center}}
</style></head><body><div class="page">
<header class="top"><div class="tagline">بسم الله الرحمن الرحيم</div><div class="htitle">القرآن الكريم</div><div class="brand">Quran<span>.can-du-ai</span>.com</div></header>
<h1>مراجعة الاقتراحات</h1>
<p class="sub">الاقتراحات قيد المراجعة تظهر في صفحتها (الإعجاز العلمي في مجموعة «اقتراحات قيد المراجعة» أسفل الصفحة، ووصف الجنة في آخر القائمة) بلون مختلف مع علامة «قيد المراجعة»، حتى تعتمدها فتظهر عادية أو ترفضها فتختفي.</p>
<div class="bar"><input id="tok" type="password" placeholder="رمز المسؤول" autocomplete="off" style="min-width:260px"><button class="pri" id="login">دخول</button>
<button id="run" hidden>شغّل الوكيل الآن</button></div>
<div class="bar" id="tabs" hidden><button data-s="pending" class="on">قيد المراجعة</button><button data-s="approved">المعتمدة</button><button data-s="rejected">المرفوضة</button></div>
<div id="msg"></div><div id="list"></div></div>
<script>
const $=(i)=>document.getElementById(i), esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GROUPS=['الإنسان والحياة','الفلك والكون','الأرض والجغرافيا','البحار والمياه والجو','الحيوان','التاريخ والآثار','النبات والزراعة','التحدي والإعجاز البياني'];
let token=''; try{token=sessionStorage.getItem('adm')||''}catch{}; let status='pending';
const H=()=>({authorization:'Bearer '+token,'content-type':'application/json'});
async function load(){
  $('msg').textContent='جارٍ التحميل…';
  const r=await fetch('/api/admin/candidates?status='+status,{headers:H()});
  if(r.status===401){$('msg').textContent='الرمز غير صحيح.';$('tabs').hidden=true;$('run').hidden=true;$('list').innerHTML='';return}
  const rows=await r.json(); $('tabs').hidden=false; $('run').hidden=false; $('msg').textContent=rows.length?`${rows.length} اقتراح`:'لا توجد اقتراحات في هذا القسم.';
  const verses={}; for(const c of rows){ try{ verses[c.id]=await (await fetch('/api/ayat?keys='+c.keys.join(','))).json() }catch{ verses[c.id]=[] } }
  $('list').innerHTML=rows.map(c=>`<div class="card" data-id="${c.id}">
    <div class="meta">#${c.id} · <b>${c.topic==='jannah'?'وصف الجنة':'الإعجاز العلمي'}</b> · ${esc(c.week)} · النموذج: ${esc(c.model)}${c.score!=null?` · <span class="score">تقييم الناقد ${c.score}/10</span>`:''}</div>
    <input class="t" value="${esc(c.title)}" style="width:100%;font-weight:700;margin:6px 0">
    ${c.topic==='jannah'?'':`<div class="bar"><select class="g">${GROUPS.map((n,i)=>`<option value="${i}"${i===c.g?' selected':''}>${n}</option>`).join('')}</select></div>`}
    ${c.issues?`<div class="issues">ملاحظة الناقد: ${esc(c.issues)}</div>`:''}
    <textarea class="n">${esc(c.note)}</textarea>
    ${(verses[c.id]||[]).map(v=>`<div class="vt">${esc(v.text)}</div><div class="ref">سورة ${esc(v.surah_ar)} — الآية ${v.ayah} [${esc(v.key)}]</div>`).join('')}
    <div class="bar">${status!=='approved'?'<button class="pri" data-a="approve">اعتمد ونشر</button>':'<button data-a="pending">أعد إلى المراجعة</button>'}${status!=='rejected'?'<button class="bad" data-a="reject">ارفض</button>':'<button data-a="pending">أعد إلى المراجعة</button>'}</div></div>`).join('');
}
$('login').onclick=()=>{token=$('tok').value.trim(); try{sessionStorage.setItem('adm',token)}catch{} load()};
$('tabs').onclick=(e)=>{const b=e.target.closest('button'); if(!b)return; status=b.dataset.s; [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b)); load()};
$('list').onclick=async(e)=>{const b=e.target.closest('button[data-a]'); if(!b)return; const card=b.closest('.card');
  const body={id:+card.dataset.id,action:b.dataset.a,title:card.querySelector('.t').value,note:card.querySelector('.n').value,...(card.querySelector('.g')?{g:+card.querySelector('.g').value}:{})};
  b.disabled=true; const r=await fetch('/api/admin/update',{method:'POST',headers:H(),body:JSON.stringify(body)}); if(r.ok){card.remove(); $('msg').textContent='تم.'} else {b.disabled=false; $('msg').textContent='تعذّر الحفظ.'}};
$('run').onclick=async()=>{$('run').disabled=true;$('msg').textContent='الوكيل يبحث الآن… قد يستغرق دقيقة.'; try{const r=await fetch('/api/admin/run?wait=1',{method:'POST',headers:H()}); const j=await r.json(); $('msg').textContent=j.error?('خطأ: '+j.error):`اقتُرح ${j.proposed}، تحقّق منها ${j.verified}، اجتاز الناقد ${j.passedCritic}، حُفظ ${j.saved}.`}catch{$('msg').textContent='انقطع الاتصال؛ حدّث الصفحة بعد قليل.'} $('run').disabled=false; status='pending'; load()};
if(token){$('tok').value=token; load()}
</script></body></html>
